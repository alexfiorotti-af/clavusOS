<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E91E8C">
<meta name="description" content="ClavusOS — gestão completa do seu studio de unhas: agenda, clientes, caixa e assinaturas num app só.">
<title>ClavusOS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Crect width='72' height='72' rx='18' fill='%23E91E8C'/%3E%3Crect x='26' y='24' width='20' height='30' rx='8' fill='%23FCE4F1'/%3E%3Crect x='31' y='12' width='10' height='15' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* ClavusOS — design system "Agenda Beleza" (ver repositório agenda-beleza-skill) */
:root{
  --rosa:#E91E8C; --rosa-escuro:#C2185B; --rosa-claro:#FCE4F1;
  --lilas:#9C27B0; --dourado:#B8860B; --pessego:#FF8A65;
  --ink:#2D1B2E; --ink-soft:#7A6B7D; --fundo:#FFF7FB; --card:#FFFFFF; --linha:#F3DCEA;
  --ok:#2E9E6B; --alerta:#E6A23C; --erro:#D64550;
  --grad:linear-gradient(135deg,#E91E8C 0%,#9C27B0 100%);
  --raio:16px; --sombra:0 4px 16px rgba(233,30,140,.12);
  --fonte:'Poppins','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--ink);font-family:var(--fonte);font-size:15px;line-height:1.45}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
button{font-family:var(--fonte);border:0;background:none;cursor:pointer;color:inherit;font-size:inherit}
input,select,textarea{font-family:var(--fonte);font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--linha);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rosa);outline-offset:1px;border-color:var(--rosa)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
::placeholder{color:#B9A9BC}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#E91E8C}
header{background:var(--grad);color:#fff;border-radius:0 0 24px 24px;
  padding-block:16px 18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{font-size:13px;font-weight:500;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.ola{font-size:22px;font-weight:700;margin:2px 0 10px;text-wrap:balance}
.resumos{display:flex;gap:8px;flex-wrap:wrap}
.resumo{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;backdrop-filter:blur(4px)}
.resumo b{color:#FFE082;font-weight:700;font-variant-numeric:tabular-nums}
.resumo.alerta-chip{background:rgba(45,27,46,.28)}

/* Conteúdo */
main{flex:1;padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.secao{font-size:17px;font-weight:700;margin:4px 0 0}
.meta{font-size:13px;color:var(--ink-soft)}
.topo-view{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Pílulas */
.pilulas{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.pilulas::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:9px 18px;border-radius:999px;background:var(--card);border:1.5px solid var(--linha);font-weight:600;font-size:14px;color:var(--ink-soft);transition:transform .15s ease-out}
.pill.ativa{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--sombra)}
.pill:active{transform:scale(.96)}
.pill .num{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--erro);color:#fff;font-size:11px;margin-left:4px}

/* Tira de dias */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dia{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:14px;background:var(--card);border:1.5px solid var(--linha);position:relative;transition:transform .15s}
.dia:active{transform:scale(.95)}
.dia small{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase}
.dia b{font-size:16px;font-weight:700}
.dia.sel{background:var(--grad);border-color:transparent;box-shadow:var(--sombra)}
.dia.sel small,.dia.sel b{color:#fff}
.dia .pt{width:5px;height:5px;border-radius:50%;background:var(--rosa);margin-top:1px}
.dia.sel .pt{background:#FFE082}
.dia:disabled{opacity:.35}

/* Card de agendamento */
.lista{display:flex;flex-direction:column;gap:10px}
.ag{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);border-left:4px solid var(--alerta);
  padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;transition:transform .15s ease-out}
.ag:active{transform:scale(.98)}
.ag.confirmado{border-left-color:var(--ok)}
.ag.concluido{border-left-color:var(--ink-soft);opacity:.72}
.ag.cancelado{border-left-color:var(--erro);opacity:.6}
.ag .hora{font-weight:700;font-size:15px;min-width:46px;font-variant-numeric:tabular-nums}
.ag .hora span{display:block;font-size:11px;font-weight:500;color:var(--ink-soft)}
.ag .info{flex:1;min-width:0}
.ag .cli{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .srv{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .dir{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ag .preco{font-weight:700;color:var(--dourado);font-size:15px;font-variant-numeric:tabular-nums}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px}
.badge.pendente{background:#FBF0DC;color:#A66B13}
.badge.confirmado{background:#DCF3E7;color:#1D7A4E}
.badge.concluido{background:#EEE9EF;color:var(--ink-soft)}
.badge.cancelado{background:#FBE1E3;color:#B03340}
.badge.lead{background:#EDE0F5;color:#6A1B9A}
.badge.vencida{background:#FBE1E3;color:#B03340}
.badge.niver{background:#FFF3D6;color:#8A6200}
.badge.online{background:#DDF0FB;color:#1565A0}
.menu-btn{padding:6px;color:var(--ink-soft);border-radius:8px}

/* Empty state */
.vazio{background:var(--card);border:1.5px dashed var(--linha);border-radius:var(--raio);padding:30px 20px;text-align:center;color:var(--ink-soft)}
.vazio svg{margin-bottom:8px}
.vazio p{margin:0 0 14px;font-weight:500}
.livre{font-size:13px;color:var(--ink-soft);padding:8px 14px;background:#FDF2F8;border-radius:12px}

/* Semana / mês */
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk-nav b{font-size:15px}
.seta{width:38px;height:38px;border-radius:12px;background:var(--card);border:1.5px solid var(--linha);font-size:18px;font-weight:700;color:var(--rosa)}
.dia-grupo h4{margin:8px 0 8px;font-size:14px;font-weight:700}
.dia-grupo h4 span{font-weight:500;color:var(--ink-soft);font-size:13px}
.cal{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:14px}
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-grade .wd{text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;padding:4px 0}
.cel{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:600;position:relative}
.cel:disabled{color:#D9C9DB}
.cel.hoje{box-shadow:inset 0 0 0 2px var(--rosa)}
.cel.sel{background:var(--grad);color:#fff}
.cel .pts{display:flex;gap:2px;height:5px}
.cel .pts i{width:4px;height:4px;border-radius:50%;background:var(--rosa)}
.cel.sel .pts i{background:#FFE082}
.cel .mais{font-size:8px;font-weight:700;color:var(--lilas)}
.cel.sel .mais{color:#FFE082}

/* Mapa de agenda */
.mapa{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:12px;overflow-x:auto}
.mapa-grid{display:flex;gap:8px;min-width:0}
.mapa-horas{flex:0 0 44px;position:relative}
.mapa-horas span{position:absolute;left:0;font-size:11px;font-weight:600;color:var(--ink-soft);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.mapa-col{flex:1 1 0;min-width:120px;position:relative;background:#FDF5FA;border-radius:12px}
.mapa-col .col-nome{position:sticky;top:0;text-align:center;font-size:12px;font-weight:700;padding:4px 2px;color:var(--ink-soft);background:transparent}
.mapa-slotline{position:absolute;left:0;right:0;border-top:1px dashed var(--linha)}
.mapa-ag{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px;font-size:11.5px;font-weight:600;color:#fff;overflow:hidden;box-shadow:0 2px 6px rgba(45,27,46,.18)}
.mapa-ag small{display:block;font-weight:500;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapa-ag.cancelado{opacity:.4;text-decoration:line-through}

/* Clientes / listas */
.linha-item{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:12px 14px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--rosa-claro);color:var(--rosa-escuro);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
.linha-item .info{flex:1;min-width:0}
.linha-item .nome{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-item .sub{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-srv{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.inativo{opacity:.5}
.toggle{width:44px;height:26px;border-radius:999px;background:#E6D9E8;position:relative;transition:background .15s;flex:0 0 auto}
.toggle.on{background:var(--ok)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:21px}
.banner{background:#FBE1E3;color:#8E2733;border-radius:var(--raio);padding:13px 16px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px}
.banner.suave{background:#FFF3D6;color:#7A5410}

/* Caixa / financeiro */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:12px;text-align:center}
.kpi .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.kpi.pos .v{color:var(--ok)}
.kpi.neg .v{color:var(--erro)}
.kpi.gold .v{color:var(--dourado)}
.acoes-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acao-btn{background:var(--card);border:1.5px solid var(--linha);border-radius:var(--raio);padding:13px 6px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .12s}
.acao-btn:active{transform:scale(.96)}
.acao-btn span{font-size:20px}
.tx{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:11px 14px;display:flex;align-items:center;gap:11px}
.tx .ic{width:36px;height:36px;border-radius:12px;background:var(--rosa-claro);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.tx.despesa .ic{background:#FBE1E3}
.tx .info{flex:1;min-width:0}
.tx .d{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--ink-soft)}
.tx .val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ok)}
.tx.despesa .val{color:var(--erro)}

/* Relatórios */
.bar-linha{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar-linha .rot{flex:0 0 108px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-linha .trilho{flex:1;height:14px;background:#F6EAF2;border-radius:999px;overflow:hidden}
.bar-linha .trilho i{display:block;height:100%;background:var(--grad);border-radius:999px;min-width:3px}
.bar-linha.neg .trilho i{background:var(--erro)}
.bar-linha .num{flex:0 0 auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:6px 4px;border-bottom:1.5px solid var(--linha)}
.tabela td{padding:8px 4px;border-bottom:1px solid #F8EDF4;font-variant-numeric:tabular-nums}
.tabela td:last-child,.tabela th:last-child{text-align:right}

/* Menu "Mais" */
.menu-item{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:15px 16px;display:flex;align-items:center;gap:13px;width:100%;text-align:left}
.menu-item .mi-ic{font-size:21px;width:28px;text-align:center}
.menu-item .info{flex:1}
.menu-item .nome{font-weight:700;font-size:15px}
.menu-item .sub{font-size:12.5px;color:var(--ink-soft)}
.volta{display:inline-flex;align-items:center;gap:6px;color:var(--rosa);font-weight:700;font-size:14px;padding:4px 0}

/* FAB + tab bar */
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));
  width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;font-size:28px;font-weight:600;
  box-shadow:0 8px 24px rgba(156,39,176,.4);z-index:20;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1.5px solid var(--linha);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:10.5px;font-weight:600;color:var(--ink-soft)}
.tab.ativa{color:var(--rosa)}
.tab svg{width:22px;height:22px}

/* Bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(45,27,46,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{background:var(--fundo);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  animation:sobe .2s ease-out}
.alca{width:44px;height:5px;border-radius:999px;background:#E0CFE3;margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px}
@keyframes sobe{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--linha);font-size:13px;font-weight:600;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.sel{background:var(--rosa);border-color:var(--rosa);color:#fff}
.chip:disabled{background:#F4EBF2;color:#C7B4C9;border-style:dashed}
.chip small{font-weight:500;opacity:.8}
.chips.horas{display:grid;grid-template-columns:repeat(4,1fr);max-height:170px;overflow-y:auto;padding:2px}
.chips.horas .chip{text-align:center;padding:9px 4px;font-variant-numeric:tabular-nums}
.chips.diasmes{display:grid;grid-template-columns:repeat(7,1fr);padding:2px}
.chips.diasmes .chip{text-align:center;padding:9px 2px;font-variant-numeric:tabular-nums}
.cores{display:flex;gap:10px}
.cor{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.cor.sel{border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--linha);border-radius:12px;background:var(--card);overflow:hidden;flex:0 0 auto}
.stepper button{width:34px;height:38px;font-size:18px;font-weight:700;color:var(--rosa)}
.stepper b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}

/* Botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:15px;min-height:48px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.prim{background:var(--grad);color:#fff;box-shadow:var(--sombra)}
.btn.sec{background:var(--card);border:1.5px solid var(--linha);color:var(--ink)}
.btn.perigo{background:#FBE1E3;color:#B03340}
.btn.zap{background:#DCF3E7;color:#1D7A4E}
.acoes{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.aviso{background:#FBF0DC;color:#7A5410;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500;margin-top:14px}

/* Blocos / ajustes */
.bloco{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:16px}
.bloco h4{margin:0 0 4px;font-size:15px}
.bloco .meta{margin-bottom:8px}
.dias-chips{display:flex;gap:6px}
.dias-chips .chip{flex:1;text-align:center;padding:9px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rodape{text-align:center;font-size:12px;color:var(--ink-soft);padding:8px 0 4px}

/* Toast */
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-8px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .2s ease-out;z-index:50;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

.busca{position:relative}
.sugestoes{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--linha);border-radius:12px;box-shadow:var(--sombra);z-index:5;max-height:180px;overflow-y:auto}
.sugestoes button{display:block;width:100%;text-align:left;padding:11px 14px;font-weight:500}
.sugestoes button:active{background:var(--rosa-claro)}
.sugestoes .nova{color:var(--rosa);font-weight:700}

/* Agendamento online (prévia) */
.online-head{background:var(--grad);border-radius:var(--raio);color:#fff;padding:18px;text-align:center}
.online-head b{font-size:19px;display:block}
.online-head span{font-size:13px;opacity:.9}
.passo{font-size:13px;font-weight:700;color:var(--lilas);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){#app{box-shadow:0 0 40px rgba(156,39,176,.1)}}
</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Novo" hidden>+</button>
<nav><div class="nav-in" id="tabs"></div></nav>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* =====================================================================
   ClavusOS — Fase 1 (PWA offline, dados no navegador)
   Base: agenda-beleza-skill + blueprint do construtor de SaaS (AF)
   Padrões herdados: estado versionado + ensureSchema (migração aditiva),
   export/import JSON, ponto de recuperação antes de importar.
   ===================================================================== */
const APP_NAME='ClavusOS', APP_VER='1.0.0', SCHEMA_V=1;

/* ===== i18n (trocar este objeto = traduzir o app) ===== */

/* ===== Datas (sempre locais, ISO — ver data-model.md da skill) ===== */
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>toISO(new Date());
const addDays=(iso,n)=>{const[y,m,d]=iso.split('-').map(Number);return toISO(new Date(y,m-1,d+n))};
const addMonths=(iso,n)=>{const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1+n,1);
  const nd=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,nd));return toISO(dt)};
const diffDays=(a,b)=>{const u=x=>{const[y,m,d]=x.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((u(b)-u(a))/86400000)};
const toMin=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const dow=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const fmt=(iso,opt)=>{const[y,m,d]=iso.split('-').map(Number);return new Intl.DateTimeFormat(S().locale,opt).format(new Date(y,m-1,d))};
const diaFala=iso=>iso===todayISO()?'hoje':iso===addDays(todayISO(),1)?'amanhã':fmt(iso,{weekday:'long',day:'2-digit',month:'2-digit'});
const brl=v=>new Intl.NumberFormat(S().locale,{style:'currency',currency:S().currency,maximumFractionDigits:0}).format(v||0);
const overlap=(a1,a2,b1,b2)=>a1<b2&&b1<a2;

function pushTxServico(a,demo){
  if(txs.some(x=>x.refId===a.id))return;
  txs.push({id:uid(),type:'receita',category:'Serviço',description:`${a.serviceName} — ${a.clientName}`,
    amount:+a.price||0,date:a.date,method:'',source:'servico',refId:a.id,
    staffId:a.staffId||null,staffName:a.staffName||'',demo:!!demo,createdAt:Date.now()});
}
/* Migração aditiva, nunca destrutiva (padrão do blueprint) */
function ensureSchema(){
  let v=load(K.v,0);
  if(v<1){
    if(settings.cycleDays===undefined)settings.cycleDays=25;
    services.forEach(s=>{if(s.cycleDays===undefined)s.cycleDays=settings.cycleDays});
    clients.forEach(c=>{if(!c.origin)c.origin='Outra';if(c.birthday===undefined)c.birthday='';if(!c.status)c.status='ativa'});
    appts.forEach(a=>{if(a.staffId===undefined){a.staffId=null;a.staffName=''}});
    v=1;persist();save(K.v,v);
  }
  /* futuras migrações: if(v<2){...; v=2; save(K.v,v)} */
}
settings=load(K.set,null);

else{services=load(K.srv,[]);clients=load(K.cli,[]);appts=load(K.ag,[]);
  txs=load(K.tx,[]);products=load(K.prod,[]);staff=load(K.stf,[]);plans=load(K.pln,[]);subs=load(K.sub,[]);

/* Unha vencida: última data concluída + ciclo do serviço (ou padrão) */
function nailInfo(c){
  const done=appts.filter(a=>a.clientId===c.id&&a.status==='concluido').sort((a,b)=>b.date.localeCompare(a.date));
  if(!done.length)return null;
  const a=done[0];const srv=services.find(s=>s.id===a.serviceId);
  const cyc=+(srv&&srv.cycleDays!==undefined?srv.cycleDays:settings.cycleDays)||0;
  if(!cyc)return{last:a.date,due:null,overdue:0,inDays:0,cyc:0};
  const due=addDays(a.date,cyc);const d=diffDays(due,todayISO());
  return{last:a.date,due,overdue:d>0?d:0,inDays:d<=0?-d:0,cyc};
}
const vencidas=()=>clients.filter(c=>{const n=nailInfo(c);return n&&n.due&&n.overdue>0});
const niverMes=()=>clients.filter(c=>c.birthday&&c.birthday.slice(5,7)===todayISO().slice(5,7));
const leads=()=>clients.filter(c=>c.status==='lead');

/* ---------- AGENDA ---------- */
function pilulas(){
  const amanha=addDays(todayISO(),1);
  const at=p=>{
    if(p==='hoje')return st.modo==='dia'&&st.anchor===todayISO();
    if(p==='amanha')return st.modo==='dia'&&st.anchor===amanha;
    return st.modo===p};
  let extra='';
  if(st.modo==='dia'&&st.anchor!==todayISO()&&st.anchor!==amanha)
    extra=`<button class="pill ativa">${fmt(st.anchor,{weekday:'short',day:'2-digit'})}</button>`;
  return `<div class="pilulas">
    <button class="pill ${at('hoje')?'ativa':''}" data-action="periodo" data-p="hoje">${t.hoje}</button>
    <button class="pill ${at('amanha')?'ativa':''}" data-action="periodo" data-p="amanha">${t.amanha}</button>
    ${extra}
    <button class="pill ${at('semana')?'ativa':''}" data-action="periodo" data-p="semana">${t.semana}</button>
    <button class="pill ${at('mes')?'ativa':''}" data-action="periodo" data-p="mes">${t.mes}</button>
    <button class="pill ${at('mapa')?'ativa':''}" data-action="periodo" data-p="mapa">${t.mapa} 🗺</button>
  </div>`;
}
function filtroStaff(){

  return `<div class="pilulas">
    <button class="chip ${st.staffF==='todas'?'sel':''}" data-action="stf-f" data-id="todas">Todas</button>
    ${a.map(s=>`<button class="chip ${st.staffF===s.id?'sel':''}" data-action="stf-f" data-id="${s.id}">${esc(s.name.split(' ')[0])}</button>`).join('')}

const filtraStf=l=>st.staffF==='todas'?l:l.filter(a=>a.staffId===st.staffF);
function tiraDias(){
  let h='<div class="strip">';
  for(let i=0;i<14;i++){const d=addDays(todayISO(),i);
    h+=`<button class="dia ${st.anchor===d&&st.modo==='dia'?'sel':''}" data-action="dia" data-d="${d}">
      <small>${fmt(d,{weekday:'short'}).replace('.','')}</small><b>${d.slice(8)}</b>
      ${ativos(d).length?'<span class="pt"></span>':''}</button>`}
  return h+'</div>';
}

  return `<div class="lista">${l.map(cardAg).join('')}</div>`;

function viewMapa(){
  const d=st.anchor;
  const abre=toMin(settings.openTime),fecha=toMin(settings.closeTime);
  const pxMin=1.5,altura=(fecha-abre)*pxMin;
  const lst=doDia(d).filter(a=>a.status!=='cancelado');
  const cols=stfAtivas().length
    ?[...stfAtivas().map(s=>({id:s.id,nome:s.name.split(' ')[0],cor:s.color})),
      ...(lst.some(a=>!a.staffId)?[{id:null,nome:'Sem profissional',cor:'#7A6B7D'}]:[])]
    :[{id:'*',nome:'Agenda',cor:'#E91E8C'}];
  let linhas='';
  for(let m=abre;m<=fecha;m+=60)linhas+=`<span style="top:${28+(m-abre)*pxMin}px">${fromMin(m)}</span>`;
  const colHtml=cols.map(c=>{
    const ags=lst.filter(a=>c.id==='*'||a.staffId===c.id);
    let slots='';for(let m=abre;m<=fecha;m+=60)slots+=`<div class="mapa-slotline" style="top:${28+(m-abre)*pxMin}px"></div>`;
    const blocos=ags.map(a=>{
      const top=28+(toMin(a.start)-abre)*pxMin,h=Math.max(a.durationMin*pxMin,26);
      return `<button class="mapa-ag ${a.status}" style="top:${top}px;height:${h}px;background:${c.cor}" data-action="abrir-ag" data-id="${a.id}">
        ${a.start} ${esc(a.clientName.split(' ')[0])}<small>${esc(a.serviceName)}</small></button>`}).join('');
    return `<div class="mapa-col" style="height:${altura+40}px"><div class="col-nome">${esc(c.nome)}</div>${slots}${blocos}</div>`;
  }).join('');
  return `${tiraDias()}
    <div><span class="secao">Mapa — ${diaFala(d)}</span>
    <div class="meta">${lst.length} ${lst.length===1?t.atend1:t.atend} · colunas por profissional</div></div>
    <div class="mapa"><div class="mapa-grid">
      <div class="mapa-horas" style="height:${altura+40}px">${linhas}</div>${colHtml}
    </div></div>`;
}

    corpo=`<div class="wk-nav"><button class="seta" data-action="wk" data-n="-7" aria-label="Semana anterior">‹</button>
      <b>${fmt(ini,{day:'2-digit',month:'short'})} – ${fmt(addDays(ini,6),{day:'2-digit',month:'short'})}</b>
      <button class="seta" data-action="wk" data-n="7" aria-label="Próxima semana">›</button></div>`;
    for(let i=0;i<7;i++){const d=addDays(ini,i);const n=filtraStf(ativos(d)).length;
      corpo+=`<div class="dia-grupo"><h4>${fmt(d,{weekday:'long',day:'2-digit',month:'2-digit'})} <span>— ${n?n+' '+(n===1?t.atend1:t.atend):''}</span></h4>${listaDia(d,true)}</div>`}
  }else if(st.modo==='mapa'){
    corpo=viewMapa();return pilulas()+filtroStaff()+corpo;
  }else{
    const[y,m]=st.mo.split('-').map(Number);
    const prim=`${y}-${pad(m)}-01`;
    const nd=new Date(y,m,0).getDate();
    const off=(dow(prim)+6)%7;
    let cels='';
    for(let i=0;i<off;i++)cels+='<button class="cel" disabled></button>';
    for(let d=1;d<=nd;d++){const iso=`${y}-${pad(m)}-${pad(d)}`;const n=ativos(iso).length;
      const pts=n?`<span class="pts">${'<i></i>'.repeat(Math.min(n,3))}${n>3?`<span class="mais">+${n-3}</span>`:''}</span>`:'<span class="pts"></span>';
      cels+=`<button class="cel ${iso===todayISO()?'hoje':''} ${iso===st.moSel?'sel':''}" data-action="mo-dia" data-d="${iso}">${d}${pts}</button>`}
    corpo=`<div class="cal"><div class="wk-nav"><button class="seta" data-action="mo" data-n="-1" aria-label="Mês anterior">‹</button>
      <b style="text-transform:capitalize">${fmt(prim,{month:'long',year:'numeric'})}</b>
      <button class="seta" data-action="mo" data-n="1" aria-label="Próximo mês">›</button></div>
      <div class="cal-grade">${['seg','ter','qua','qui','sex','sáb','dom'].map(w=>`<span class="wd">${w}</span>`).join('')}${cels}</div>
      <button class="pill" data-action="mo-hoje" style="margin-top:10px">${t.hoje}</button></div>
      <div><span class="secao">${fmt(st.moSel,{weekday:'long',day:'2-digit',month:'2-digit'})}</span></div>
      ${listaDia(st.moSel,true)}`;
  }
  return pilulas()+filtroStaff()+corpo;
}

/* ---------- CLIENTES ---------- */
function subCli(c){
  const n=nailInfo(c);
  const parts=[];
  if(c.status==='lead')parts.push(`<span class="badge lead">lead · ${esc(c.origin)}</span>`);
  if(n&&n.due&&n.overdue>0)parts.push(`<span class="badge vencida">vencida há ${n.overdue}d</span>`);
  if(c.birthday&&c.birthday.slice(5,7)===todayISO().slice(5,7))parts.push(`<span class="badge niver">🎂 ${c.birthday.slice(8)}/${c.birthday.slice(5,7)}</span>`);
  return parts.length?parts.join(' '):esc(fmtFone(c.phone))||'sem telefone';
}

/* ---------- RELATÓRIOS ---------- */
function barras(pares,total){
  const max=Math.max(...pares.map(p=>p[1]),1);
  return pares.map(([r,v,neg])=>`<div class="bar-linha ${neg?'neg':''}">
    <span class="rot">${esc(r)}</span>
    <span class="trilho"><i style="width:${Math.round(v/max*100)}%"></i></span>
    <span class="num">${brl(v)}</span></div>`).join('')||'<p class="meta">Sem dados no período.</p>';
}
function viewRelatorios(){
  const ym=st.relMes;
  const lst=txDoMes(ym);
  const ent=somaTx(lst,'receita'),sai=somaTx(lst,'despesa');
  const porCat=(tipo)=>{const m={};lst.filter(x=>x.type===tipo).forEach(x=>{m[x.category]=(m[x.category]||0)+(+x.amount||0)});
    return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const concl=appts.filter(a=>a.status==='concluido'&&a.date.slice(0,7)===ym);
  const prodStaff={};concl.forEach(a=>{const k=a.staffName||(stfAtivas().length?'Sem profissional':esc(settings.ownerName));
    (prodStaff[k]=prodStaff[k]||{n:0,v:0,id:a.staffId});prodStaff[k].n++;prodStaff[k].v+=(+a.price||0)});
  const topSrv={};concl.forEach(a=>{(topSrv[a.serviceName]=topSrv[a.serviceName]||{n:0,v:0});topSrv[a.serviceName].n++;topSrv[a.serviceName].v+=(+a.price||0)});
  const topL=Object.entries(topSrv).sort((a,b)=>b[1].v-a[1].v).slice(0,5);

  <div class="kpis">
    <div class="kpi pos"><div class="v">${brl(ent)}</div><div class="l">Receitas</div></div>
    <div class="kpi neg"><div class="v">${brl(sai)}</div><div class="l">Despesas</div></div>
    <div class="kpi ${ent-sai>=0?'gold':'neg'}"><div class="v">${brl(ent-sai)}</div><div class="l">Resultado</div></div>
  </div>
  <div class="bloco"><h4>Fluxo de caixa do mês</h4>
    ${barras([['Entradas',ent],['Saídas',sai,true]])}
  </div>
  <div class="bloco"><h4>Receitas por origem</h4>
    ${barras(porCat('receita'))}
  </div>
  <div class="bloco"><h4>Despesas por categoria</h4>
    ${barras(porCat('despesa').map(([r,v])=>[r,v,true]))}
  </div>
  <div class="bloco"><h4>Produção por profissional</h4>
    ${stfL.length?`<table class="tabela"><tr><th>Profissional</th><th>Atend.</th><th>Total</th><th>Comissão</th></tr>
      ${stfL.map(([n,d])=>{const s=stfDe(d.id);const com=s?d.v*(+s.commissionPct||0)/100:0;
        return `<tr><td>${esc(n)}</td><td>${d.n}</td><td>${brl(d.v)}</td><td>${s?brl(com)+` <span class="meta">(${+s.commissionPct||0}%)</span>`:'—'}</td></tr>`}).join('')}
    </table>`:'<p class="meta">Nenhum atendimento concluído no mês.</p>'}

    ${topL.length?`<table class="tabela"><tr><th>Serviço</th><th>Qtd</th><th>Total</th></tr>
      ${topL.map(([n,d])=>`<tr><td>${esc(n)}</td><td>${d.n}</td><td>${brl(d.v)}</td></tr>`).join('')}
    </table>`:'<p class="meta">Nenhum atendimento concluído no mês.</p>'}
  </div>`;
}

function viewOnline(){
  const o=st.online||{};
  const srvAtivos=services.filter(s=>s.active);
  let corpo='';
  if(!o.serviceId){
    corpo=`<div class="passo">Passo 1 · Escolha o serviço</div>
    <div class="chips">${srvAtivos.map(s=>`<button class="chip" data-action="ol-srv" data-id="${s.id}">${esc(s.name)} <small>· ${brl(s.price)}</small></button>`).join('')}</div>`;
  }else if(!o.date){
    let dias='<div class="strip">';
    for(let i=0;i<14;i++){const d=addDays(todayISO(),i);const ok=settings.workDays.includes(dow(d));
      dias+=`<button class="dia" data-action="ol-dia" data-d="${d}" ${ok?'':'disabled'}>
        <small>${fmt(d,{weekday:'short'}).replace('.','')}</small><b>${d.slice(8)}</b></button>`}
    corpo=`<div class="passo">Passo 2 · Escolha o dia</div>${dias}</div>`;
  }else if(!o.start){
    const srv=services.find(s=>s.id===o.serviceId);
    const oc=appts.filter(a=>a.date===o.date&&a.status!=='cancelado');
    let chips='';
    for(let m=toMin(settings.openTime);m+srv.durationMin<=toMin(settings.closeTime);m+=settings.slotMinutes){
      const busy=oc.some(a=>overlap(m,m+srv.durationMin,toMin(a.start),toMin(a.start)+a.durationMin));
      if(!busy)chips+=`<button class="chip" data-action="ol-hora" data-h="${fromMin(m)}">${fromMin(m)}</button>`}
    corpo=`<div class="passo">Passo 3 · Horários livres em ${diaFala(o.date)}</div>
    <div class="chips horas">${chips||'<p class="meta">Nenhum horário livre nesse dia 😢</p>'}</div>
    <button class="btn sec" data-action="ol-volta-dia" style="margin-top:10px">Escolher outro dia</button>`;
  }else{
    corpo=`<div class="passo">Passo 4 · Seus dados</div>
    <label for="ol-nome">Seu nome</label><input id="ol-nome" data-action="ol-nome" value="${esc(o.nome||'')}">

    <button class="btn sec" data-action="ol-reset">Recomeçar</button></div>`;
  }
  const resumo=o.serviceId?`<p class="meta">💅 ${esc(services.find(s=>s.id===o.serviceId)?.name||'')}${o.date?` · ${diaFala(o.date)}`:''}${o.start?` às ${o.start}`:''}</p>`:'';
  return `${volta}
  <div class="online-head"><b>${esc(settings.businessName)}</b><span>Agende seu horário 💖</span></div>
  <div class="banner suave">🌐 <b>Prévia</b> — na Fase 2 esta tela vira um link público para suas clientes agendarem sozinhas.</div>
  ${resumo}${corpo}`;
}

function renderSheet(){
  const r=$('#sheet-root');
  if(!st.sheet){r.innerHTML='';return}
  const s=st.sheet;let html='';
  if(s.tipo==='ag')html=sheetAg();
  else if(s.tipo==='detalhe')html=sheetDetalhe();
  else if(s.tipo==='cli')html=sheetCli();
  else if(s.tipo==='cli-detalhe')html=sheetCliDetalhe();

  else if(s.tipo==='plano')html=sheetPlano();

function horasChips(f){
  const oc=appts.filter(a=>a.date===f.date&&a.status!=='cancelado'&&a.id!==f.id);
  let h='';
  for(let m=toMin(settings.openTime);m<toMin(settings.closeTime);m+=settings.slotMinutes){
    const hh=fromMin(m);
    const busy=oc.find(a=>overlap(m,m+settings.slotMinutes,toMin(a.start),toMin(a.start)+a.durationMin));
    h+=`<button class="chip ${f.start===hh?'sel':''}" data-action="f-hora" data-h="${hh}" ${busy?'disabled':''}>${hh}${busy?`<br><small>${esc(busy.clientName.split(' ')[0])}</small>`:''}</button>`}
  return h;
}

/* ===== Ações ===== */
let toastTm;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTm);toastTm=setTimeout(()=>el.classList.remove('show'),2500)}
function abrirNovoAg(pre){
  st.form={id:null,clientId:pre?.clientId||null,cliTexto:pre?.clientId?cliDe(pre.clientId).name:'',
    serviceId:null,staffId:st.staffF!=='todas'?st.staffF:(stfAtivas()[0]?.id||null),
    date:(st.modo==='mes'?st.moSel:st.anchor),start:'',durationMin:'',notes:'',conflito:null,forcar:false};
  st.sheet={tipo:'ag'};render();
}
function checaConflito(f){
  const fim=toMin(f.start)+(+f.durationMin||settings.slotMinutes);
  const c=appts.find(a=>a.id!==f.id&&a.date===f.date&&a.status!=='cancelado'&&
    (!stfAtivas().length||!f.staffId||a.staffId===f.staffId)&&
    overlap(toMin(f.start),fim,toMin(a.start),toMin(a.start)+a.durationMin));
  return c?t.conflito(c.clientName.split(' ')[0],c.start):null;
}
function salvarAg(){
  const f=st.form;
  if(!f.cliTexto||!f.serviceId||!f.date||!f.start){toast('Preencha cliente, serviço, data e hora 🌸');return}
  const conf=checaConflito(f);
  if(conf&&!f.forcar){f.conflito=conf;f.forcar=true;render();return}
  const srv=services.find(s=>s.id===f.serviceId);
  let cid=f.clientId;
  if(!cid){const nova={id:uid(),name:f.cliTexto.trim(),phone:'',notes:'',origin:'Outra',birthday:'',status:'ativa',createdAt:Date.now()};
    clients.push(nova);cid=nova.id}
  const stf=stfDe(f.staffId);
  const dado={clientId:cid,clientName:cliDe(cid).name,serviceId:srv.id,serviceName:srv.name,
    price:f.price!==undefined&&f.price!==''?+f.price:srv.price,date:f.date,start:f.start,
    durationMin:+f.durationMin||srv.durationMin,staffId:stf?stf.id:null,staffName:stf?stf.name:'',
    notes:f.notes||'',demo:false};
  if(f.id){Object.assign(appts.find(a=>a.id===f.id),dado)}
  else appts.push({id:uid(),status:'pendente',createdAt:Date.now(),...dado});
  persist();st.sheet=null;st.modo=st.modo==='mapa'?'mapa':'dia';st.anchor=f.date;render();toast(t.salvo);
}
function zapLink(fone,msg){
  const base=fone?`https://wa.me/${String(fone).replace(/\D/g,'')}`:'https://wa.me/';
  window.open(`${base}?text=${encodeURIComponent(msg)}`,'_blank');
}
function zapAg(a){
  const c=cliDe(a.clientId);
  const msg=`Oi, ${a.clientName.split(' ')[0]}! 💖 Confirmando seu horário de ${a.serviceName} ${diaFala(a.date)} às ${a.start} aqui no ${settings.businessName}. Qualquer coisa me avisa. Até lá! ✨`;
  zapLink(c?.phone,msg);
}
function zapVencida(c){
  const n=nailInfo(c);
  const msg=`Oi, ${c.name.split(' ')[0]}! 💅 Senti sua falta por aqui — já faz ${n?n.overdue+Math.min(n.cyc,99):'um tempinho'} dias desde a sua última unha. Que tal garantir seu horário essa semana no ${settings.businessName}? Tenho encaixes ótimos te esperando ✨`;
  zapLink(c.phone,msg);
}
function concluirAg(a){
  a.status='concluido';
  pushTxServico(a,false);
  const c=cliDe(a.clientId);
  if(c&&c.status==='lead')c.status='ativa';
}
function gerarHorariosSub(s){
  const pl=plans.find(p=>p.id===s.planId);
  const srv=services.find(x=>x.id===(pl?pl.serviceId:null))||services[0];
  if(!srv){toast('Plano sem serviço vinculado 😕');return}
  const ym=todayISO().slice(0,7);let criados=0,pulados=0;
  s.days.forEach(d=>{
    const iso=`${ym}-${pad(d)}`;
    if(iso<todayISO()){pulados++;return}
    if(appts.some(a=>a.clientId===s.clientId&&a.date===iso&&a.status!=='cancelado')){pulados++;return}
    appts.push({id:uid(),clientId:s.clientId,clientName:s.clientName,serviceId:srv.id,serviceName:srv.name,
      price:0,date:iso,start:s.time||'09:00',durationMin:srv.durationMin,staffId:null,staffName:'',
      status:'pendente',notes:`Assinatura ${s.planName}`,demo:false,createdAt:Date.now()});
    criados++;
  });
  persist();render();
  toast(criados?`${criados} horário${criados>1?'s':''} criado${criados>1?'s':''} 📅${pulados?` (${pulados} pulado${pulados>1?'s':''})`:''}`:'Nenhum horário novo — dias já passaram ou já estão marcados');
}
function renovarSub(s){
  txs.push({id:uid(),type:'receita',category:'Assinatura',description:`${s.planName} — ${s.clientName}`,
    amount:+s.price||0,date:todayISO(),method:'',source:'assinatura',refId:s.id,staffId:null,demo:false,createdAt:Date.now()});
  const n={mensal:1,trimestral:3,semestral:6,anual:12}[s.period]||1;
  s.nextRenewal=addMonths(s.nextRenewal<todayISO()?todayISO():s.nextRenewal,n);
  persist();render();toast(`Renovação lançada no caixa 💖 Próxima: ${fmt(s.nextRenewal,{day:'2-digit',month:'2-digit'})}`);
}
function exportar(){
  const json=JSON.stringify({app:APP_NAME,version:SCHEMA_V,settings,services,clients,appointments:appts,
    transactions:txs,products,staff,plans,subscriptions:subs},null,2);
  st.sheet={tipo:'backup',json};render();
}

        description:nomes.join(' + ')+(f.clienteNome?` — ${f.clienteNome.trim()}`:''),
        amount:total,date:todayISO(),method:f.method||'',source:'produto',refId:null,staffId:null,demo:false,createdAt:Date.now()});
      persist();st.sheet=null;st.view='caixa';render();toast(`Venda de ${brl(total)} registrada 🛍`)},
    /* agendamento online (prévia) */
    'ol-srv':()=>{st.online={serviceId:id};render()},
    'ol-dia':()=>{st.online.date=el.dataset.d;render()},
    'ol-hora':()=>{st.online.start=el.dataset.h;render()},
    'ol-volta-dia':()=>{delete st.online.date;delete st.online.start;render()},
    'ol-reset':()=>{st.online={};render()},
    'ol-confirmar':()=>{const o=st.online;
      if(!o.nome){toast('Digite seu nome 🌸');return}
      const srv=services.find(s=>s.id===o.serviceId);
      let c=clients.find(x=>x.name.toLowerCase()===o.nome.trim().toLowerCase());
      if(!c){c={id:uid(),name:o.nome.trim(),phone:o.fone||'',notes:'',origin:'Online',birthday:'',status:'lead',createdAt:Date.now()};clients.push(c)}
      appts.push({id:uid(),clientId:c.id,clientName:c.name,serviceId:srv.id,serviceName:srv.name,price:srv.price,
        date:o.date,start:o.start,durationMin:srv.durationMin,staffId:null,staffName:'',
        status:'pendente',notes:'Agendado online',demo:false,createdAt:Date.now()});
      persist();st.online={};st.view='agenda';st.sub=null;st.modo='dia';st.anchor=o.date;render();
      toast('Agendamento online recebido! 🌐 Está pendente na agenda')},
    /* ajustes / backup / boas-vindas */
    'wd':()=>{const i=+el.dataset.i;const w=settings.workDays;
      settings.workDays=w.includes(i)?w.filter(x=>x!==i):[...w,i].sort();persist();render()},
    'exportar':()=>exportar(),
    'bk-copiar':()=>{const ta=$('#bk-json');
      navigator.clipboard.writeText(ta.value).then(()=>toast('Copiado! 📋'))
        .catch(()=>{ta.focus();ta.select();toast('Selecione e copie manualmente 📋')})},
    'importar':()=>$('#arq-imp').click(),
    'limpar-demo':()=>{appts=appts.filter(a=>!a.demo);txs=txs.filter(x=>!x.demo);subs=subs.filter(s=>!s.demo);
      persist();render();toast('Exemplos removidos ✨')},
    'bv-salvar':()=>{const f=st.form;
      if(f.businessName)settings.businessName=f.businessName.trim();
      if(f.ownerName)settings.ownerName=f.ownerName.trim();
      if(f.phone)settings.phone=String(f.phone).replace(/\D/g,'');
      persist();st.sheet=null;render();toast(`Seu studio está no ar ✨ Explore a agenda!`)},
  };
  if(acts[ac])acts[ac]();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.set){const k=el.dataset.set;
    settings[k]=(k==='slotMinutes'||k==='cycleDays')?+el.value:el.value;persist();
    if(['businessName','ownerName'].includes(k))renderHeader();return}
  const refoca=sel=>{const n=$(sel);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  const m={'busca':()=>{st.busca=el.value;renderMain();refoca('#busca-cli')},
    'f-cli':()=>{st.form.cliTexto=el.value;st.form.clientId=null;render();refoca('#f-cli')},
    'f-data':()=>{st.form.date=el.value;st.form.conflito=null;st.form.forcar=false;render()},
    'f-hlivre':()=>{st.form.start=el.value;st.form.conflito=null;st.form.forcar=false},
    'f-dur':()=>{st.form.durationMin=el.value},
    'f-obs':()=>{st.form.notes=el.value},
    'c':()=>{st.form[el.dataset.k]=el.value},
    'sv':()=>{st.form[el.dataset.k]=el.value},
    'pd':()=>{st.form[el.dataset.k]=el.value},
    'stf':()=>{st.form[el.dataset.k]=el.value},
    'pl':()=>{st.form[el.dataset.k]=el.value},
    'sb':()=>{st.form[el.dataset.k]=el.value},
    'sb-cli':()=>{st.form.cliTexto=el.value;st.form.clientId=null;render();refoca('#sb-cli')},
    'tx':()=>{st.form[el.dataset.k]=el.value},
    'vd':()=>{st.form[el.dataset.k]=el.value},
    'bv':()=>{st.form[el.dataset.k]=el.value},
    'ol-nome':()=>{st.online.nome=el.value},
    'ol-fone':()=>{st.online.fone=el.value}};
  if(m[el.dataset.action])m[el.dataset.action]();
});
document.addEventListener('change',e=>{
  if(e.target.id==='arq-imp'){const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d.settings||!d.appointments)throw 0;
      /* ponto de recuperação antes de substituir (padrão do blueprint) */
      save(K.bkp,{settings,services,clients,appointments:appts,transactions:txs,products,staff,plans,subscriptions:subs,savedAt:Date.now()});
      settings=d.settings;services=d.services||[];clients=d.clients||[];appts=d.appointments||[];
      txs=d.transactions||[];products=d.products||[];staff=d.staff||[];plans=d.plans||[];subs=d.subscriptions||[];
      ensureSchema();persist();render();toast('Dados importados 💖 (versão anterior guardada)')}
      catch(err){toast('Arquivo inválido 😕')}};
    r.readAsText(f);e.target.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.ag,.linha-item[role=button],.linha-item .info[role=button]'))e.target.click();
  if(e.key==='Escape'&&st.sheet&&st.sheet.tipo!=='boasvindas'){st.sheet=null;render()}
});

/* ===== PWA ===== */
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

if(firstRun)st.form={};
render();
</script>
</body>
</html>
